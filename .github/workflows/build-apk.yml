name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          rsync -a             --exclude='www'             --exclude='node_modules'             --exclude='android'             --exclude='.git'             --exclude='.github'             ./ www/

      - name: Prepare app icon
        run: |
          mkdir -p resources
          cp assets/appIcon.jpg resources/icon.jpg

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icon
        run: |
          npx @capacitor/assets@3.0.5 generate             --android             --iconBackgroundColor "#171329"             --iconBackgroundColorDark "#171329"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cidade-dorme-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
